name: Build Scribe APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keep the same signing key across builds so new versions install
      # over old ones. The key lives in GitHub's build cache, not the repo.
      - name: Restore Signing Key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scribe-signing-key-v1

      - name: Create Signing Key (first build only)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Show Compile Errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -80

      - name: Rename APK
        run: |
          mkdir -p dist
          VERSION="$(grep -oP 'baseVersion = "\K[^"]+' app/build.gradle.kts).${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/*.apk "dist/Scribe-$VERSION.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribe
          path: dist/*.apk

      # Every update to main (or a manual run on main) publishes a release,
      # which is what Obtainium and other updaters look for.
      - name: Publish Release (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Scribe ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
